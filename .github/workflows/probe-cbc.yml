name: Probe CBC rate reader

# Runs the project's CBC rate reader against the real workbook on a GitHub runner (the
# development environment cannot reach cbc.gov.tw). Read-only, no credentials.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_cbc.py
      - .github/workflows/probe-cbc.yml

permissions:
  contents: read

jobs:
  cbc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: CBC rates
        run: uv run python scripts/probe_cbc.py
