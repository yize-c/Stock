name: Probe export result

# Runs scripts/probe_freshness.py: why every stock failed the freshness check in the
# 2026-10-26 daily export (run 40240981656). Prints dates only (the calendar's expected latest
# close, index close days, FinMind's trading-day schedule, 2330's latest priced day). Earlier
# this workflow summarised export run 39943481791, printed the calibration result file and ran
# the exclusion probes (scripts/probe_calibration_rows.py, _details.py, _followup.py).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Freshness probe
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: uv run python scripts/probe_freshness.py
