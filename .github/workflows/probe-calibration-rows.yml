name: Probe calibration exclusions

# Why the full-market calibration run 39162884540 excluded rows (DATA_CHECK_FAILED, ERROR,
# NO_SCORE): reads that run's row artifacts and the calibration cache, prints the breakdown.
# Read-only; prints counts, check names, codes and derived statistics only.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_calibration_rows.py
      - .github/workflows/probe-calibration-rows.yml

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Restore calibration cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/calibration
          key: calibration-none
          restore-keys: calibration-
      - uses: actions/download-artifact@v4
        with:
          pattern: calibration-rows-*
          path: calibration/work
          merge-multiple: true
          run-id: 39162884540
          github-token: ${{ github.token }}
      - name: Breakdown
        env:
          FINMIND_TOKEN: ${{ secrets.SECOND_FINMIND }}
        run: |
          uv run stock-research calibration liquidity
          uv run python scripts/probe_calibration_rows.py
