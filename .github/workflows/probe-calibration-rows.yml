name: Probe calibration exclusions

# Why the full-market calibration run 39162884540 excluded rows (DATA_CHECK_FAILED, ERROR,
# NO_SCORE): reads that run's row artifacts and the calibration cache, prints the dated causes
# (scripts/probe_calibration_details.py; the first breakdown was probe_calibration_rows.py).
# Read-only; prints dates, counts, check names, labels, codes and derived statistics only.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Restore calibration cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/calibration
          key: calibration-none
          restore-keys: calibration-
      - uses: actions/download-artifact@v4
        with:
          pattern: calibration-rows-*
          path: calibration/work
          merge-multiple: true
          run-id: 39162884540
          github-token: ${{ github.token }}
      - name: Breakdown
        env:
          FINMIND_TOKEN: ${{ secrets.SECOND_FINMIND }}
        run: |
          uv run python scripts/probe_calibration_details.py
