name: Probe calibration exclusions

# Prints the result file of the 條件符合度 calibration run 39903390753 (artifact
# score-calibration) in numbered chunks, with its SHA-256, so the file can be rebuilt where
# the artifact store is unreachable and committed for the site. The file holds derived
# values only (scores, group statistics, validation results). Earlier this workflow ran the
# exclusion probes (scripts/probe_calibration_rows.py, _details.py, _followup.py).
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: score-calibration
          path: result
          run-id: 39903390753
          github-token: ${{ github.token }}
      - name: Print the result in chunks
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          raw = pathlib.Path("result/score_calibration.json").read_bytes()
          print("sha256", hashlib.sha256(raw).hexdigest(), "bytes", len(raw))
          text = json.dumps(json.loads(raw), ensure_ascii=True, separators=(",", ":"))
          print("compact_sha256", hashlib.sha256(text.encode()).hexdigest(), "chars", len(text))
          size = 2000
          for n, start in enumerate(range(0, len(text), size)):
              print(f"CHUNK {n:05d} {text[start:start + size]}")
          print("END", (len(text) + size - 1) // size)
          PY
