name: Probe MOPS active-ETF holdings

# Decision 8 = a: whether domestic active ETFs' quarterly holdings can come from MOPS (terms,
# open-data alternatives, the page's format). Read from a GitHub runner (the development
# environment cannot reach MOPS). Read-only GET/POST without credentials; only public pages.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_mops_holdings.py
      - .github/workflows/probe-mops-holdings.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: MOPS active-ETF holdings
        run: |
          pip install --quiet certifi
          SSL_CERT_FILE="$(python -m certifi)" python scripts/probe_mops_holdings.py
