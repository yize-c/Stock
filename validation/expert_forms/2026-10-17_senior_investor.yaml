# Expert record (成長 × 風險 §3): the senior investor's view as given on 2026-10-17.
# Append-only: never edit this file; add a dated follow-up file instead (a hook blocks edits).
date: 2026-10-17
expert: 資深股民（使用者的父親）
source: 使用者轉述的兩次討論（第四份 prompt 第〇節）
principles:
  - 投資要看未來的成長和未來的風險。
  - 高成長 → 高獲利 → 股價會漲；低風險 → 持股安心 → 不容易跌。
  - 未來成長和風險，主要看最近兩三年。
  - 要查歷史回撤。好公司（例如台積電）未來也可能跌 50%。
  - 股價被炒高，就是最大的風險（例：某韓國記憶體股從 52 週高點 298,700 跌到 127,200，跌 57.42%）。
  - 偏好：中度成長、低風險優於高成長、高風險。
  - 想比較美國、台灣、加拿大各五檔股票的成長性和風險。
  - 成長和風險要看財報和公司法說會；股價技術線型只是結果。
  - 財報挑公司，技術線型找買點和賣點。
  - 資訊不對稱：公司很多資料散戶看不到，所以要參考研究報告、看研究員怎麼分析。
  - 進入陌生市場時，先看哪些股票最多人買。「大家都買，所以股價有撐。」
  - 會看錯也會看對，要定時檢討為何看對、為何看錯。
  - 錢多了以後要考慮資產配置：高成長高風險、中度成長低風險等類型各放多少比例。
  - 先用 AI 找出成長性和風險性，作為買賣股票的參考；研究股票是一輩子的事。
