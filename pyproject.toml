[project]
name = "stock-research"
version = "0.1.0"
description = "Research assistant CLI for Taiwan-listed stocks: point-in-time data, regime stability checks and rule-based investor frameworks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "typer>=0.27.3",
    "yfinance>=1.7.0",
]

[project.scripts]
stock-research = "stock_research.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is Chinese prose; splitting sentences across lines would hurt readability.
"src/stock_research/llm/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["stock_research"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
