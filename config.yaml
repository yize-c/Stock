# stock-research configuration.
#
# Conventions:
# - Ratios and percentages are stored as fractions (0.15 = 15%, 0.03 = 3 percentage points).
# - Every threshold used by the code lives here; nothing market- or framework-specific is
#   hard-coded in Python.
# - Secrets (API keys, tokens) never belong in this file. Put them in `.env`.

general:
  timezone: Asia/Taipei
  default_market: tw
  # Pandemic regime split. V1 = post_2020, V3 = pre_2020 (see README "Time windows").
  regime_split_date: 2020-01-01
  # Financial statements before this year (pre-IFRS) are excluded from every window.
  ifrs_start_year: 2013

markets:
  tw:
    enabled: true
    currency: TWD
    exchanges:
      TWSE:
        yfinance_suffix: ".TW"
      TPEX:
        yfinance_suffix: ".TWO"
    price_limits:
      # Daily limit on the raw close, applied by effective date.
      # `effective_from: null` means "from the earliest available data".
      rules:
        - effective_from: null
          limit: 0.07
        - effective_from: 2015-06-01
          limit: 0.10
      rounding_tolerance: 0.005
      # Newly listed stocks have no daily limit for their first N trading days.
      new_listing_exempt_days: 5
    filing_deadlines:
      # Statutory deadline per fiscal quarter, used as a conservative `available_date`
      # when the real announcement date is unknown. Q4 (annual report) is due next year.
      quarterly:
        Q1: { month: 5, day: 15, year_offset: 0 }
        Q2: { month: 8, day: 14, year_offset: 0 }
        Q3: { month: 11, day: 14, year_offset: 0 }
        Q4: { month: 3, day: 31, year_offset: 1 }
      # Monthly revenue for month M is due by this day of month M+1.
      monthly_revenue_day: 10
    trading_calendar:
      # Historical trading days = dates with an official TAIEX close, so past typhoon
      # closures drop out automatically. Future/today use the exchange holiday notice.
      historical_source: official_index_closes
      # Ad-hoc closures (e.g. typhoon days) not yet in the exchange notice.
      # Format: - { date: 2026-07-30, reason: "Typhoon closure" }
      manual_closures: []
      # Quote times: unquoted 13:30 is parsed by YAML 1.1 as a base-60 integer.
      session_close_time: "13:30"
      # Before this time on a trading day, the latest expected close is the previous
      # trading day (covers the session itself and the gap until official data is out).
      daily_data_ready_time: "14:30"
    # Known trading suspensions (停牌). Missing prices inside these ranges are expected and
    # listed in the data-health report; gaps outside them still raise.
    # Format: - { ticker: "1234", start: 2024-03-01, end: 2024-03-15, reason: "..." }
    known_suspensions: []
    per_share:
      # Par value before any split/par-value change, for TWSE stocks. TPEx stocks use the
      # official par from TPEx. Checked against net income / EPS (share_count_tolerance).
      default_par_value: 10.0
      # Share multiplier from reference prices vs 1 + stock dividend / par.
      share_multiplier_tolerance: 0.005
      # Median ratio of implied shares (net income / EPS) to capital / par must be within
      # this of 1; a wrong par value is off by a factor of 2 or more.
      share_count_tolerance: 0.10
    industries:
      # Industry = the exchange category from FinMind's listing data. These categories are
      # boards or broad parents, not industries, and are ignored when a stock has others.
      ignored_categories: [電子工業, 化學生技醫療, 創新板股票, 存託憑證]
      # TWSE and TPEx spell some industries differently; peers are pooled under one name.
      aliases:
        其他電子類: 其他電子業
        數位雲端類: 數位雲端
        居家生活類: 居家生活
        綠能環保類: 綠能環保
        運動休閒類: 運動休閒
        金融業: 金融保險
        觀光事業: 觀光餐旅
      # Stocks whose industry is ambiguous. Format: - { ticker: "1234", industry: "半導體業" }
      overrides: []
      # Industry groups used by framework rules (proposed defaults to review).
      groups:
        financial: [金融保險]
        construction: [建材營造]
        semiconductor: [半導體業]
        mature_electronics: [電子零組件業, 電腦及週邊設備業, 光電業, 通信網路業, 電子通路業,
                             資訊服務業, 其他電子業]
        traditional: [水泥工業, 食品工業, 塑膠工業, 紡織纖維, 電機機械, 電器電纜, 化學工業,
                      玻璃陶瓷, 造紙工業, 鋼鐵工業, 橡膠工業, 汽車工業, 航運業, 油電燃氣業,
                      貿易百貨]
        consumer_staples: [食品工業, 貿易百貨]
        telecom: [通信網路業]
      peers:
        # Industry medians need at least this many peers with data in the window.
        min_peers: 5
        # Peer statements change only when a new quarter is published, so they are cached
        # longer than the stock's own data (FinMind's quota makes a full industry slow).
        cache_max_age_days: 7
    listing:
      # Emerging-board (興櫃) trading started on this date. FinMind and Yahoo include a
      # stock's emerging-board prices before its listing; those are out of scope (no price
      # limits, not a listed common share) and are dropped.
      emerging_board_start: 2002-01-02
      # Listing dates that cannot be derived from the data (a stock that first traded after
      # emerging_board_start and was listed before valuation_coverage_start).
      # Format: - { ticker: "1234", listing_date: 2004-03-15, source: "TWSE listing notice" }
      # Verified against TWSE OpenAPI t187ap03_L (上市日期), fetched 2026-10-17 from a GitHub
      # runner (scripts/probe_sources.py); the development environment cannot reach TWSE.
      overrides:
        - ticker: "2885"
          listing_date: 2002-02-04
          source: "TWSE OpenAPI t187ap03_L 上市日期 20020204."
        - ticker: "2886"
          listing_date: 2002-02-04
          source: "TWSE OpenAPI t187ap03_L 上市日期 20020204."
        - ticker: "2887"
          listing_date: 2002-02-18
          source: "TWSE OpenAPI t187ap03_L 上市日期 20020218."
        - ticker: "2890"
          listing_date: 2002-05-09
          source: "TWSE OpenAPI t187ap03_L 上市日期 20020509."
        - ticker: "2891"
          listing_date: 2002-05-17
          source: "TWSE OpenAPI t187ap03_L 上市日期 20020517."
        - ticker: "2892"
          listing_date: 2003-01-02
          source: "TWSE OpenAPI t187ap03_L 上市日期 20030102."
        - ticker: "3008"
          listing_date: 2002-03-11
          source: "TWSE OpenAPI t187ap03_L 上市日期 20020311."
        - ticker: "3017"
          listing_date: 2002-09-27
          source: "TWSE OpenAPI t187ap03_L 上市日期 20020927."
        - ticker: "3034"
          listing_date: 2002-08-26
          source: "TWSE OpenAPI t187ap03_L 上市日期 20020826."
        - ticker: "3037"
          listing_date: 2002-08-26
          source: "TWSE OpenAPI t187ap03_L 上市日期 20020826."
        - ticker: "3045"
          listing_date: 2002-08-26
          source: "TWSE OpenAPI t187ap03_L 上市日期 20020826."
        - ticker: "3231"
          listing_date: 2003-08-19
          source: "TWSE OpenAPI t187ap03_L 上市日期 20030819."
        - ticker: "4904"
          listing_date: 2005-08-24
          source: "TWSE OpenAPI t187ap03_L 上市日期 20050824. FinMind's earlier prices (from 2003-08-01) are not used."
        - ticker: "6505"
          listing_date: 2003-12-26
          source: "TWSE OpenAPI t187ap03_L 上市日期 20031226."
    # Unexplained multi-day halts before FinMind's capital-reduction coverage are detected
    # automatically (data/early_changes.py). Use this only for other cases that make early
    # prices unusable. Format: - { ticker: "1234", start: 2009-03-20, reason: "..." }
    price_history_overrides: []
    benchmark:
      # Total-return index matches returns computed from dividend-adjusted prices.
      primary: TAIEX_TOTAL_RETURN
      # Used (and noted in the report) only if the total-return index is unavailable.
      fallback_ticker: "0050"
      fallback_uses_adjusted_prices: true
      # Always shown next to the index (spec v2 P0-1): what a retail investor can actually
      # buy. Dividend-adjusted, net of its own (ETF) round-trip cost.
      compare_etf: "0050"
    risk_free:
      # One-year time deposit rate, averaged over each window. Source: Central Bank of
      # the Republic of China (Taiwan) statistics.
      source: cbc_one_year_deposit
      # The CBC file is read on every run where it is reachable (the GitHub runner; not this
      # development environment). It must agree with fallback_rates where both have a rate;
      # later months extend them.
      cbc:
        url: https://www.cbc.gov.tw/public/data/a13rate.xls
        one_year_fixed_column: 13
        start: 2003-01-01
        members:
          - { start: 2003-01-01, banks: [台銀, 合庫, 一銀, 華銀, 彰銀] }
          - { start: 2008-11-01, banks: [台銀, 土銀, 合庫, 一銀, 華銀] }
        cache_max_age_hours: 24
      # The latest monthly rate may be reused for at most this many days after its month
      # (the CBC publishes each month with a delay); the output says so. Beyond it: error.
      carry_forward_max_days: 62
      # Per-period rates (this environment cannot reach the CBC site). Values: the CBC's
      # "五大銀行存放款利率歷史月資料" (https://www.cbc.gov.tw/public/data/a13rate.xls), the
      # monthly mean of the five largest banks' one-year fixed time-deposit rate (column
      # 一年期 固定). Members: 台銀, 合庫, 一銀, 華銀, 彰銀 until 2008-10; 台銀, 土銀, 合庫,
      # 一銀, 華銀 from 2008-11 (the CBC's own definition). Read on a GitHub runner by
      # scripts/probe_tables.py on 2026-10-17; equal consecutive months merged. Extend the
      # list each month; a range not covered here raises an error.
      fallback_rates:
        - { start: 2003-01-01, end: 2003-04-30, rate: 0.0154 }
        - { start: 2003-05-01, end: 2003-05-31, rate: 0.0153 }
        - { start: 2003-06-01, end: 2003-06-30, rate: 0.01525 }
        - { start: 2003-07-01, end: 2004-09-30, rate: 0.014 }
        - { start: 2004-10-01, end: 2004-12-31, rate: 0.0152 }
        - { start: 2005-01-01, end: 2005-02-28, rate: 0.01587 }
        - { start: 2005-03-01, end: 2005-03-31, rate: 0.01684 }
        - { start: 2005-04-01, end: 2005-06-30, rate: 0.01688 }
        - { start: 2005-07-01, end: 2005-08-31, rate: 0.0179 }
        - { start: 2005-09-01, end: 2005-11-30, rate: 0.0189 }
        - { start: 2005-12-01, end: 2006-03-31, rate: 0.0199 }
        - { start: 2006-04-01, end: 2006-06-30, rate: 0.0206 }
        - { start: 2006-07-01, end: 2006-09-30, rate: 0.0213 }
        - { start: 2006-10-01, end: 2006-12-31, rate: 0.022 }
        - { start: 2007-01-01, end: 2007-03-31, rate: 0.0223 }
        - { start: 2007-04-01, end: 2007-05-31, rate: 0.0226 }
        - { start: 2007-06-01, end: 2007-08-31, rate: 0.02471 }
        - { start: 2007-09-01, end: 2007-11-30, rate: 0.02541 }
        - { start: 2007-12-01, end: 2008-03-31, rate: 0.02617 }
        - { start: 2008-04-01, end: 2008-05-31, rate: 0.02659 }
        - { start: 2008-06-01, end: 2008-06-30, rate: 0.02671 }
        - { start: 2008-07-01, end: 2008-08-31, rate: 0.02719 }
        - { start: 2008-09-01, end: 2008-09-30, rate: 0.02699 }
        - { start: 2008-10-01, end: 2008-10-31, rate: 0.02501 }
        - { start: 2008-11-01, end: 2008-11-30, rate: 0.02173 }
        - { start: 2008-12-01, end: 2008-12-31, rate: 0.01421 }
        - { start: 2009-01-01, end: 2009-01-31, rate: 0.00921 }
        - { start: 2009-02-01, end: 2009-09-30, rate: 0.00771 }
        - { start: 2009-10-01, end: 2010-05-31, rate: 0.00893 }
        - { start: 2010-06-01, end: 2010-09-30, rate: 0.01018 }
        - { start: 2010-10-01, end: 2010-12-31, rate: 0.01131 }
        - { start: 2011-01-01, end: 2011-03-31, rate: 0.01188 }
        - { start: 2011-04-01, end: 2011-06-30, rate: 0.01276 }
        - { start: 2011-07-01, end: 2015-08-31, rate: 0.01355 }
        - { start: 2015-09-01, end: 2015-11-30, rate: 0.01281 }
        - { start: 2015-12-01, end: 2016-02-29, rate: 0.01205 }
        - { start: 2016-03-01, end: 2016-06-30, rate: 0.01125 }
        - { start: 2016-07-01, end: 2020-02-29, rate: 0.01039 }
        - { start: 2020-03-01, end: 2022-02-28, rate: 0.00769 }
        - { start: 2022-03-01, end: 2022-05-31, rate: 0.01039 }
        - { start: 2022-06-01, end: 2022-08-31, rate: 0.01192 }
        - { start: 2022-09-01, end: 2022-11-30, rate: 0.01325 }
        - { start: 2022-12-01, end: 2023-02-28, rate: 0.0145 }
        - { start: 2023-03-01, end: 2024-02-29, rate: 0.01575 }
        - { start: 2024-03-01, end: 2026-09-30, rate: 0.017 }
    industry_classification: twse_tpex
    data_validation:
      # Before FinMind's capital-reduction coverage, a halt of at least this many trading
      # days followed by a close beyond the price limit (and no ex-rights event) is treated
      # as an uncovered capital change: prices start on the resumption day.
      min_halt_trading_days: 3
      # A traded day with volume but no price counts as a day without a close (user decision
      # 2026-10-19; in the full-market probe 80% of such runs were one day and the volume
      # was 0.2% of the stock's median traded day, p90 1.8%). Longer runs, or more volume
      # than this share of the median traded day, look like a source outage and fail.
      unpriced_max_run_days: 10
      unpriced_max_volume_share: 0.20
      # Raw-close cross-check between official, FinMind and yfinance.
      cross_source_tolerance: 0.005
      # Yahoo closes found wrong against the official daily data (TWSE STOCK_DAY, TPEx
      # tradingStock, read on a GitHub runner on 2026-10-17). These days are left out of the
      # FinMind-vs-Yahoo comparison, and FinMind must equal official_close on them. Any other
      # disagreement still fails.
      known_source_errors:
        - { source: yahoo, ticker: "2412", date: 2024-03-29, official_close: 126.0, evidence: "TWSE STOCK_DAY 2024-03 (Yahoo 127.0)" }
        - { source: yahoo, ticker: "1216", date: 2024-03-29, official_close: 77.5, evidence: "TWSE STOCK_DAY 2024-03 (Yahoo 76.5)" }
        - { source: yahoo, ticker: "2603", date: 2024-03-29, official_close: 172.0, evidence: "TWSE STOCK_DAY 2024-03 (Yahoo 175.0)" }
        - { source: yahoo, ticker: "2382", date: 2024-03-29, official_close: 293.5, evidence: "TWSE STOCK_DAY 2024-03 (Yahoo 286.5)" }
        - { source: yahoo, ticker: "6488", date: 2024-03-25, official_close: 582.0, evidence: "TPEx tradingStock 2024-03 (Yahoo 592.0)" }
        - { source: yahoo, ticker: "6488", date: 2024-03-29, official_close: 580.0, evidence: "TPEx tradingStock 2024-03 (Yahoo 560.0)" }
        - { source: yahoo, ticker: "9921", date: 2024-03-29, official_close: 217.5, evidence: "TWSE STOCK_DAY 2024-03 (Yahoo 220.5)" }
        - { source: yahoo, ticker: "2317", date: 2024-03-29, official_close: 150.0, evidence: "TWSE STOCK_DAY 2024-03 (Yahoo 151.5)" }
        - { source: yahoo, ticker: "2454", date: 2024-03-29, official_close: 1195.0, evidence: "TWSE STOCK_DAY 2024-03 (Yahoo 1185.0)" }
        - { source: yahoo, ticker: "1101", date: 2024-03-29, official_close: 32.15, evidence: "TWSE STOCK_DAY 2024-03 (Yahoo 31.9)" }
        - { source: yahoo, ticker: "5347", date: 2024-03-18, official_close: 84.8, evidence: "TPEx tradingStock 2024-03 (Yahoo 83.9)" }
        - { source: yahoo, ticker: "5347", date: 2024-03-20, official_close: 89.7, evidence: "TPEx tradingStock 2024-03 (Yahoo 90.8, the 03-19 close)" }
        - { source: yahoo, ticker: "5347", date: 2024-03-25, official_close: 86.3, evidence: "TPEx tradingStock 2024-03 (Yahoo 87.9, the 03-22 close)" }
        - { source: yahoo, ticker: "5347", date: 2024-09-23, official_close: 108.0, evidence: "TPEx tradingStock 2024-09 (Yahoo 106.644, scaled before the 2024-10-01 rights issue)" }
        - { source: yahoo, ticker: "5347", date: 2024-09-24, official_close: 107.0, evidence: "TPEx tradingStock 2024-09 (Yahoo 105.656, scaled before the 2024-10-01 rights issue)" }
        - { source: yahoo, ticker: "5347", date: 2024-09-25, official_close: 106.5, evidence: "TPEx tradingStock 2024-09 (Yahoo 105.163, scaled before the 2024-10-01 rights issue)" }
        - { source: yahoo, ticker: "5347", date: 2024-09-26, official_close: 105.0, evidence: "TPEx tradingStock 2024-09 (Yahoo 103.682, scaled before the 2024-10-01 rights issue)" }
        - { source: yahoo, ticker: "5347", date: 2024-09-27, official_close: 103.0, evidence: "TPEx tradingStock 2024-09 (Yahoo 101.707, scaled before the 2024-10-01 rights issue)" }
        - { source: yahoo, ticker: "5347", date: 2024-09-30, official_close: 103.5, evidence: "TPEx tradingStock 2024-09 (Yahoo 102.2, scaled before the 2024-10-01 rights issue)" }
      cross_source_lookback_trading_days: 60
      # |assets - (liabilities + equity)| / assets above this triggers a warning.
      balance_sheet_tolerance: 0.01
      # Monthly revenue is flagged as suspicious when |YoY| exceeds this.
      revenue_yoy_abs_max: 5.0
  us:
    # Planned for stage 11. Present so the config shape already supports it.
    enabled: false
    currency: USD
    benchmark:
      primary: SPY

weighting:
  # weight = 0.5 ** (age_days / half_life_days); age measured from the window end.
  # V2 (full) is never weighted.
  half_life_days:
    daily_returns: 90
    monthly_revenue: 365
    quarterly_financials: 730
    annual_financials: 1095
    news_text: 30

stability:
  # Economic difference: relative gap for level metrics.
  relative_tolerance: 0.15
  # Economic difference: absolute (percentage-point) gap for ratio metrics.
  # Only ROE (3pp) is given by the spec; the rest are proposed defaults to review.
  absolute_tolerance:
    roe: 0.03
    roic: 0.03
    gross_margin: 0.03
    operating_margin: 0.03
    net_margin: 0.03
    revenue_yoy: 0.05
    annualized_return: 0.05
    annualized_volatility: 0.05
    dividend_yield: 0.01
    # Proposed defaults to review: historical drawdown and one-day VaR are fractions too.
    max_drawdown: 0.10
    var: 0.01
  # Framework and composite scores (0-1 proportions).
  score_tolerance: 0.15
  alpha: 0.05
  multiple_testing: benjamini_hochberg
  min_samples:
    econ_observations: 2
    ttm_quarters: 4
    daily_observations: 60
    monthly_observations: 24
    # Below this many observations the result carries a LOW_SAMPLE flag.
    low_sample_threshold: 8
  internal_split:
    # "midpoint" splits V1 at its midpoint (moves with as_of); "fixed" uses fixed_date.
    mode: midpoint
    fixed_date: null
  crash_exclusion:
    price_start: 2020-02-20
    price_end: 2020-06-30
    annual_years: [2020]
    # Any TTM value that includes one of these quarters is excluded.
    quarters: ["2020Q1", "2020Q2"]
  breakpoints:
    # Quandt-Andrews trimming on each end; critical values from Andrews (1993).
    trimming: 0.15

frameworks:
  # Rules that ask for 10 years use "all available years, at least min_years" in V1/V3.
  min_years: 5
  original_years: 10
  definitions:
    recent_years: 5
    # "Increasing year over year": at least this many non-decreasing years in recent_years.
    increasing_min_years: 4
    # "Keeps making new highs": at least one window-high month in this many recent months.
    new_high_lookback_months: 12
  warren_chou:
    # Core EPS = operating income / shares (same share basis for both quarters).
    max_recent_quarter_eps_yoy_decline: 0.30
    reference_yield_range: [0.05, 0.06]
  guyu:
    core_profit_ratio_min: 0.80
    interest_coverage_min: 20
    roe_min: 0.08
    operating_margin_min: 0.0
    pe_max: 12
    dividend_yield_min: 0.06
    excluded_industries: [financial, construction]
    expected_roe_by_industry:
      semiconductor: 0.10
      mature_electronics: 0.08
      traditional: 0.06
  chen_chung_ming:
    preferred_industries: [financial, consumer_staples, telecom]
  buffett:
    roe_min: 0.15
    # Interest-bearing borrowings (short-term + long-term + bonds) / total equity.
    debt_to_equity_max: 0.5
    fcf_positive_year_ratio_min: 0.8
  graham:
    pe_times_pb_max: 22.5
    current_ratio_min: 2.0
  lynch:
    peg_max: 1.0
    # Growth-category boundaries on 5-year EPS CAGR; proposed defaults to review.
    growth_categories:
      slow_grower_max: 0.06
      stalwart_max: 0.20
  munger:
    roic_min: 0.12

scoring:
  # Member weights are shares of the total score and must sum to the group weight.
  # N/A frameworks are renormalized within their group first, then groups are combined.
  groups:
    taiwan:
      weight: 0.6
      members:
        warren_chou: 0.2
        guyu: 0.2
        chen_chung_ming: 0.2
    international:
      weight: 0.4
      members:
        buffett: 0.1
        graham: 0.1
        lynch: 0.1
        munger: 0.1

data_sources:
  cache_dir: .cache/stock_research
  finmind:
    # Free tier allows 600 requests per hour; stay below it.
    max_requests_per_hour: 550
    # The daily export waits out an exhausted quota (status 402) instead of failing the
    # remaining stocks; interactive commands never wait.
    quota_retries: 2
    quota_wait_minutes: 20
    # TaiwanStockCapitalReductionReferencePrice starts with 2011 events.
    capital_reduction_coverage_start: 2011-01-01
    # First date requested for daily series; each series starts where FinMind's data does
    # (stock prices from 1994, TAIEX closes and the trading calendar from 1999-01-05).
    history_start: 1990-01-01
    # Prices are used from this date on. FinMind's ex-rights/ex-dividend reference prices
    # (TaiwanStockDividendResult) and the TAIEX total-return index both start in 2003, so
    # earlier prices cannot be adjusted for dividends and have no matching benchmark.
    price_history_start: 2003-01-01
    # First day of TaiwanStockPER, which comes from the exchanges' daily valuation files.
    # Those cover listed stocks only, so a later first date is the listing date.
    valuation_coverage_start: 2005-09-02
    # Institutional buy/sell and margin balances (score part E) are read from this date;
    # the calibration starts in 2021, so earlier days are never used.
    chips_history_start: 2020-01-01
  official:
    # Minimum delay between requests to TWSE / TPEx / MOPS endpoints.
    min_request_interval_seconds: 3.0
  yahoo:
    min_request_interval_seconds: 1.0
  # Cached responses older than this are refetched, never served as current data.
  cache_max_age_hours: 12
  # Also refetch responses fetched before the latest daily_data_ready_time (any day): a run
  # after the close must not reuse the morning's data (the 2026-10-23 18:28 manual export
  # served a 07:26 cache without that day's close and failed the freshness check). The
  # calibration turns this off: it reads a fixed past date from a cache kept for days.
  refetch_after_data_ready: true
  request_timeout_seconds: 60
  # A dropped connection (no response at all; TPEx's OpenAPI cut one off on 2026-10-20 and
  # failed that day's export) is retried twice, after 10 s and 20 s. Status codes, block
  # pages and bad JSON are never retried.
  network_retries: 2
  network_retry_wait_seconds: 10
  # Mainstream sites are never scraped by default; reports only link to them.
  scrape_reference_sites: false

risk:
  var_confidence: 0.95
  annualization_days: 252
  # Shown next to risk metrics so readers know whether a window contains them.
  major_events:
    - { name: "2008 全球金融海嘯", start: 2008-09-01, end: 2009-03-31 }
    - { name: "2015 漲跌幅放寬至 10%", start: 2015-06-01, end: 2015-06-01 }
    - { name: "2020 疫情崩跌", start: 2020-02-20, end: 2020-06-30 }
    - { name: "2022 升息與台股修正", start: 2022-01-01, end: 2022-12-31 }

technicals:
  sma_windows: [20, 60, 240]
  rsi_window: 14
  macd: { fast: 12, slow: 26, signal: 9 }

llm:
  provider: anthropic
  model: claude-opus-5-5
  # This model rejects sampling parameters (temperature); thinking is always on and its depth
  # is set by effort. Reliability comes from the output schema and program verification.
  effort: high
  # Maximum response length (output tokens).
  max_output: 16000
  # One retry after a failed call (API error, refusal, schema violation), then FAILED.
  max_retries: 1
  log_dir: logs/llm
  # MOPS is unreachable from the development environment: annual reports and briefing
  # decks are read from local files <documents_dir>/<ticker>/<YYYY-MM-DD>_<title>.(pdf|txt|md),
  # where the date is the publication date.
  documents_dir: data/documents
  # Documents are sent newest first; beyond this many characters the oldest are dropped.
  max_document_chars: 400000
  # Extracted PDF text is rejected below these quality bars (not sent to the LLM).
  min_document_chars: 500
  min_cjk_ratio: 0.2
  max_replacement_ratio: 0.01
  # A number in a claim matches a source or computed value within this relative gap.
  number_tolerance: 0.01

report:
  language: zh-TW
  output_dir: reports
  # Pages for checking the numbers by hand. Links only: these sites are never scraped.
  # Placeholders: {code} (e.g. 2330) and {yahoo_symbol} (e.g. 2330.TW / 6488.TWO).
  reference_links:
    - { name: "Goodinfo!", url: "https://goodinfo.tw/tw/StockDetail.asp?STOCK_ID={code}" }
    - { name: "Yahoo 奇摩股市", url: "https://tw.stock.yahoo.com/quote/{yahoo_symbol}" }
    - { name: "鉅亨網", url: "https://www.cnyes.com/twstock/{code}" }
    - { name: "公開資訊觀測站（輸入代號查詢）", url: "https://mops.twse.com.tw/mops/" }

validation:
  # Spec §14. Paths are relative to the working directory (the repository root).
  directory: validation
  # §14.1: aspect verdict = worst verdict of its metrics; overall = worst aspect.
  # "營收成長率" is measured by the monthly revenue YoY (the only revenue-growth metric).
  aspects:
    revenue: [revenue_yoy]
    profitability: [roe, gross_margin, operating_margin, eps]
    risk: [volatility, beta, max_drawdown]
  known_cases:
    file: validation/known_cases.yaml
    as_of: 2026-09-30
  walk_forward:
    horizon_months: 3
    # Base dates are month ends inside each range. Quarantine base dates are never used.
    dev: { start: 2023-12-31, end: 2025-06-30 }
    quarantine: { start: 2025-07-01, end: 2025-09-30 }
    holdout: { start: 2025-10-31, end: 2026-06-30 }
    # Fixed list chosen before any run: the known cases plus large and mid caps across
    # industries, all listed before the first base date (see preregistration.md for the
    # survivorship limitation).
    universe: [
      "2603", "2609", "2615", "2382", "3231", "2376", "9921",
      "2412", "1216", "2912", "9917",
      "2330", "2317", "2454", "2308", "1301", "2002", "1101", "2881",
      "6488", "5347", "3008", "2207", "2105",
    ]
    # Fewer forward daily returns than this leaves a price outcome unavailable.
    min_forward_returns: 20
    max_tuning_attempts: 30
    # Config paths a dev run may override with --set (spec §14.4 tunable parameters).
    tunable:
      - stability.absolute_tolerance
      - stability.relative_tolerance
      - weighting.half_life_days
      - stability.internal_split
      - stability.crash_exclusion
    baseline_draws: 1000
    bootstrap_draws: 1000
    confidence: 0.95
    alpha: 0.05
    seed: 20231231
  forward_tracking:
    enabled: true
    compare_after_months: [6, 12]
  experts:
    # Cohen's kappa (tool vs expert majority) must reach kappa_min, or be no lower than
    # the experts' own kappa minus kappa_margin.
    kappa_min: 0.6
    kappa_margin: 0.1
  # Preregistered success criteria (§14.2); preregistration.md restates them.
  success:
    known_cases_accuracy: 0.80
    report_score_margin: 0.5

app:
  # Static web app (add to the iPhone home screen) fed by a daily batch export.
  # The export analyses every stock below at today's date; stocks that fail the data checks
  # are published with the failed checks, never with older data.
  watchlist: [
    "2330", "2317", "2454", "2308", "2382", "2303", "3711", "2357", "3231", "2376",
    "3008", "2379", "3034", "2408", "3037", "2345", "6669", "3017", "2395", "6488",
    "5347", "2412", "2327", "4904", "2881", "2882", "2891", "2886", "2892", "5880",
    "2880", "2885", "2801", "2890", "1301", "1303", "1326", "6505", "2002", "1101",
    "1216", "2912", "2207", "9910", "9921", "9917", "2603", "2609", "2615", "1476",
  ]
  # Industry medians need every peer's statements: too many requests for a daily run on
  # FinMind's free tier, so framework items that need them show as unavailable.
  with_peers: false
  # A published dataset older than this is flagged as stale in the app.
  stale_after_hours: 36

costs:
  # Taiwan trading costs (spec v2 §3). Fees are charged on both the buy and the sell; the
  # securities transaction tax only on the sell.
  fee_rate: 0.001425
  # Broker discount: 0.6 = 60% of the listed fee.
  fee_discount: 1.0
  # Minimum fee per order (NT$); some odd-lot brokers charge 1.
  min_fee: 20
  tax_stock: 0.003
  tax_etf: 0.001
  board_lot: 1000
  # Position size (NT$) for cost-adjusted returns where no capital tier applies.
  reference_position: 100000

research_score:
  # The 0-100 score of spec v2 §4 (user's choice A, 2026-10-17). Base score from its parts;
  # a part without data is left out and the others are scaled to 100, but with fewer than
  # min_available_points of parts available there is no score. Since 成長 × 風險 (user's
  # plan 1, 2026-10-17) the former valuation (15) and risk (15) parts are folded into the
  # risk score, and growth and safety (100 - risk score) share growth_risk points.
  points: { principles: 30, consistency: 20, growth_risk: 40, chips: 10 }
  max_chips_share: 0.15  # spec v2 P2-11: chips weigh at most 15%
  min_available_points: 70
  preferences:
    # 成長 × 風險 §1.4: only the growth / safety split of growth_risk changes; the default is
    # the senior investor's (conservative: risk weighs more).
    default: conservative
    options:
      conservative: { label: 保守, growth_share: 0.375 }  # 15 growth / 25 safety
      balanced: { label: 平衡, growth_share: 0.5 }  # 20 / 20
      aggressive: { label: 積極, growth_share: 0.625 }  # 25 / 15
  consistency:
    # B: among the metrics whose walk-forward is positive (written by
    # `stock-research validation metric-walk-forward`), the share judged STABLE.
    walk_forward_results: validation/results/metric_walk_forward.json
    full_share: 1.0
    partial_share: 0.5
  valuation:
    # Percentile of today's exchange P/E and P/B among the stock's own daily values over the
    # last lookback_years (the risk score's overheating); needs at least min_years.
    lookback_years: 10
    min_years: 3
  chips:
    # E (spec v2 P2-11), three factors averaged, each 0.5 at "no change":
    # - the three institutional investors' combined net buying (+) or selling (-) days in a
    #   row up to as_of (streak_full_days of buying = full, the same of selling = none);
    # - the investment trust's net buying over the last lookback_trading_days as a share of
    #   all shares (its change in holdings; trust_change_full = full, the same sold = none);
    # - margin purchase balance / limit (none at margin_usage_zero or more).
    lookback_trading_days: 20
    investors: [Foreign_Investor, Foreign_Dealer_Self, Investment_Trust]
    streak_full_days: 10
    trust_investor: Investment_Trust
    trust_change_full: 0.01
    margin_usage_zero: 0.5
  # Capital tiers the export scores in advance (spec: 5萬, 30萬, 100萬, 300萬) with a holding
  # count inside the spec's range for each (<5萬: 1-3, 5-30萬: 3-5, 30-100萬: 5-10,
  # >100萬: 10-20). The web app only switches between them.
  capital_tiers:
    - { capital: 50000, holdings: 3 }
    - { capital: 300000, holdings: 5 }
    - { capital: 1000000, holdings: 10 }
    - { capital: 3000000, holdings: 15 }
  default_capital: 300000
  capital_factor:
    # Spec §4.3: -0.2 at each cost-ratio step, -0.1 if only odd lots fit, -0.1 if one
    # position is over 25% of capital; never below 0.5.
    cost_ratio_steps: [0.008, 0.012]
    cost_step_penalty: 0.2
    odd_lot_penalty: 0.1
    concentration: 0.25
    concentration_penalty: 0.1
    floor: 0.5
  caps:
    # Spec §4.2: a score group whose historical average (net of costs) does not beat the
    # deposit rate is capped at below_risk_free; one that does worse than 0050, at below_etf.
    below_risk_free: 40
    below_etf: 55
  labels:
    - { min_score: 75, name: 強 }
    - { min_score: 60, name: 中 }
    - { min_score: 45, name: 觀察 }
    - { min_score: 0, name: 弱, note: "0050 或定存的歷史表現較好" }

calibration:
  # Full-market calibration of the base score (spec v2 §4.2), run on GitHub Actions with
  # the second FinMind token. Values fixed before the first run; later changes are
  # recorded in calibration/CHANGELOG.md.
  output: calibration/score_calibration.json
  work_dir: calibration/work
  cache_dir: .cache/calibration
  cache_max_age_days: 60
  # Every source is read as of this date (a fixed clock), so the multi-day GitHub runs share
  # one cache and one result.
  data_as_of: 2026-10-16
  # Month-end base dates from start to last_base_date; each needs its 12-month horizon to
  # have passed by data_as_of.
  start: 2021-06-30
  last_base_date: 2025-09-30
  horizon_months: 12
  # Base dates from here on are out of sample: the score-group table shown and the gate
  # use only them; earlier ones are reported as in-sample for comparison.
  out_of_sample_start: 2024-01-31
  # Each month keep the most traded half (60-day average traded value) of the stocks.
  liquidity_lookback_trading_days: 60
  liquidity_keep_share: 0.5
  # Score groups per month (deciles). Gate: the top group's out-of-sample return must beat
  # the bottom group's and the rank correlation between group and return must reach this.
  groups: 10
  min_rank_correlation: 0.7
  # 條件符合度 (user decision 2026-10-18): validation a (score vs the next 12 months' maximum
  # drawdown) and b (vs the next 12 months' EPS and revenue growth, judged separately) pass
  # when the top group beats the bottom group and the rank correlation of group and the
  # groups' median outcome reaches this. The return calibration (c) above is recorded but no
  # longer decides whether the score is shown.
  validation_min_rank_correlation: 0.5
  # Strategy backtest (user decisions 2026-10-18: quarterly; the lenient criteria): the
  # `holdings` highest base scores among the liquid stocks, at most max_industry_share of them
  # from one industry, equal weight, net of trading costs, against 0050 with dividends. The
  # score needs V1 (from 2020) and full TTM, so it starts in 2021-06; 2022 falls in sample and
  # 2025-04 out of sample.
  strategy:
    first_rebalance: 2021-06-30
    last_rebalance: 2026-06-30
    end: 2026-09-30
    rebalance_months: 3
    holdings: 10
    max_industry_share: 0.30
    out_of_sample_start: 2023-12-31
    # Out of sample is under 3 years, so its rolling holding periods are 1 year.
    rolling_years_out_of_sample: 1
    rolling_years_full: 3
    max_drawdown_ratio: 0.8  # drawdown at most 0.8 x 0050's
    cagr_shortfall: 0.03  # annual return at least 0050's minus 3 percentage points
    sharpe_shortfall: 0.0  # Sharpe at least 0050's
    positive_share_shortfall: 0.0  # positive rolling periods at least 0050's share
  confidence: 0.95
  bootstrap_draws: 1000
  seed: 20211031
  shards: 30
  # Not common shares: ETFs/ETNs (00...), TDRs (91...).
  excluded_code_prefixes: ["0", "91"]

robustness:
  # Spec v2 P1-8: the V1 framework conclusions re-run with every weighting.half_life_days
  # value scaled by these factors (the configured half-lives are the 1.0 run).
  half_life_multipliers: [0.5, 2.0]
  # Shown when a conclusion differs between the shortest and the longest half-life: it then
  # depends on how much the most recent years count.
  recent_only_note: 可能只反映 2023 年後的 AI 多頭行情
  # Spec v2 P1-9: warn when an in-sample result is at least this many times the
  # out-of-sample one (calibration: top-minus-bottom group spread; walk-forward: AUC - 0.5).
  overfit_ratio: 2.0

portfolio:
  # Holdings, P&L, sell reminders and capital suggestions (user decisions 2026-10-17).
  # Holdings stay in the viewer's browser; the export publishes official TWSE/TPEx closes and
  # ex-rights events (open data), the tool's score history and these parameters.
  # The published site: each export extends the history archive found there.
  site_url: https://yize-c.github.io/Stock/
  # Codes taxed as ETFs (0.1% securities transaction tax on the sell).
  etf_code_prefixes: ["00"]
  alerts:
    score_drop: 15        # points below the score at purchase
    score_floor: 45
    concentration: 0.25   # one holding over this share of total market value
  allocation:
    min_score: 60
    # Candidates whose calibration cap gives this reason are left out (spec: "0050 的歷史表現較好").
    excluded_cap_reason: 0050 的歷史表現較好
    max_weight: 0.25
    cash_reserve: 0.05
    fallback_etf: "0050"
    cost_ratio_warning: 0.008
  backup_reminder_days: 30

growth:
  # 成長 × 風險 §1.1 (the senior investor's view, 2026-10-17): the last lookback_years of
  # actual results, published by as_of, as a reference for future growth (not a forecast).
  # Each item maps linearly from 0 (at zero) to 1 (at full), clipped; the score is 100 x the
  # weighted mean of the items with data. Ratios are fractions (0.20 = 20%).
  lookback_years: 3
  min_items: 2
  min_trend_points: 8
  revenue_cagr: { weight: 0.3, zero: 0.0, full: 0.20 }
  eps_cagr: { weight: 0.3, zero: 0.0, full: 0.25 }
  revenue_yoy: { weight: 0.2, zero: 0.0, full: 0.20 }
  gross_margin_trend: { weight: 0.2, zero: -0.02, full: 0.02 }  # per year: -2 to +2 points

risk_rating:
  # 成長 × 風險 §1.2: 0-100, higher is more dangerous; historical statistics, not future
  # probabilities. Each item is a danger 0-1 from its band (0 at zero, 1 at full, either
  # direction, clipped); the score is 100 x the weighted mean of the items with data.
  # "股價被炒高就是最大的風險": overheating weighs the most (checked when loading).
  lookback_years: 3
  week52_days: 365
  min_week52_days: 120
  min_trading_days: 250
  min_weight: 0.6
  weights: { overheat: 0.35, drawdown: 0.20, off_high: 0.15, volatility: 0.15, stability: 0.15 }
  drawdown: { zero: 0.20, full: 0.60 }
  # Near the 52-week high is taken as more dangerous (the senior investor's "炒高"); 30% or
  # more below it, as no extra danger. Swap zero and full to read it the other way.
  off_high: { zero: 0.30, full: 0.0 }
  rise_from_low: { zero: 0.10, full: 1.00 }
  price_share: 0.5  # overheating = this x rise from the low + the rest x P/E-P/B percentile
  volatility: { zero: 0.20, full: 0.60 }
  beta: { zero: 0.8, full: 1.5 }
  stability: { stable: 0.0, regime_shift: 0.5, unstable: 1.0 }

quadrant:
  # 成長 × 風險 §1.3: growth score at or above growth_high is 高成長, at or above growth_mid
  # 中成長, else 低成長; risk score at or above risk_high is 高風險, else 低風險.
  growth_high: 67
  growth_mid: 33
  risk_high: 50
  preferred: mid_low  # 中成長・低風險, the senior investor's preference

risk_checklist:
  # 成長 × 風險 §1.2.1: the user's five TSMC risks turned into numbers where statements allow
  # (information only, never scored); the rest comes from documents the user provides.
  lookback_years: 3
  min_points: 4
  flat_points: 0.01  # ratios: a change under 1 percentage point over the window is flat
  flat_relative: 0.05  # amounts and days: a change under 5% of the mean level is flat

allocation:
  # 成長 × 風險 §1.7: the asset mix for each investor preference (research_score.preferences).
  # Tentative values from the user (2026-10-18), awaiting the senior investor's confirmation;
  # every place that uses them shows `status`. *_max are upper limits; shares add up to 1.
  status: 暫定，待資深股民確認
  profiles:
    conservative:
      mid_growth_low_risk: 0.50
      etf_0050: 0.30
      high_growth_mid_risk_max: 0.10
      high_growth_high_risk_max: 0.00
      cash: 0.10
    balanced:
      mid_growth_low_risk: 0.35
      etf_0050: 0.30
      high_growth_mid_risk_max: 0.20
      high_growth_high_risk_max: 0.05
      cash: 0.10
    aggressive:
      mid_growth_low_risk: 0.25
      etf_0050: 0.25
      high_growth_mid_risk_max: 0.30
      high_growth_high_risk_max: 0.15
      cash: 0.05
